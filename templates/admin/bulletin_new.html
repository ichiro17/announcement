{% extends "base.html" %}
{% block title %}建立簽收單 - 公告簽收系統{% endblock %}
{% block content %}
<h1>建立新簽收單</h1>
<form method="post" class="card">
  <label>公告編號 *（bulletin.tn.edu.tw 網址列 bid= 後面的數字，會自動組成連結）
    <input type="text" name="bulletin_no" placeholder="例如：290857" required>
  </label>
  <label>標題 *
    <input type="text" name="title" required>
  </label>
  <label>簽收期限
    <input type="date" name="deadline">
  </label>
  <p class="hint">首頁公開清單上的「應簽對象」會自動列出下方勾選對象目前的單位/職稱，不需另外填寫、也不會列出個別姓名。</p>

  <fieldset>
    <legend>應簽對象 *</legend>
    <div class="quick-select">
      <span>快速選取：</span>
      <button type="button" onclick="selectAll(true)">全校</button>
      <button type="button" onclick="selectAll(false)">全部取消</button>
      {% for dept in departments %}
        <button type="button" onclick="selectByAttr('dept', '{{ dept }}')">{{ dept }}</button>
      {% endfor %}
      {% for t in titles %}
        <button type="button" onclick="selectByAttr('title', '{{ t }}')">{{ t }}</button>
      {% endfor %}
    </div>
    <div class="staff-checklist">
      {% for s in all_staff %}
        <label class="staff-item">
          <input type="checkbox" name="target_ids" value="{{ s.id }}" data-dept="{{ s.department }}" data-title="{{ s.title }}">
          {{ s.name }}（{{ s.department }} / {{ s.title }}）
        </label>
      {% endfor %}
    </div>
  </fieldset>

  <button type="submit">建立簽收單</button>
</form>

<script>
function selectAll(checked) {
  document.querySelectorAll('.staff-checklist input[type=checkbox]').forEach(function (cb) {
    cb.checked = checked;
  });
}
function selectByAttr(attr, value) {
  var dataAttr = attr === 'dept' ? 'dept' : 'title';
  document.querySelectorAll('.staff-checklist input[type=checkbox]').forEach(function (cb) {
    if (cb.dataset[dataAttr] === value) {
      cb.checked = true;
    }
  });
}
</script>
{% endblock %}
